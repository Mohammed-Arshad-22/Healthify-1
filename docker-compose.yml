version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: healthify-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthify
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: healthify-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/healthify
      - JWT_SECRET=healthify_super_secret_jwt_key_2026_production
      - JWT_EXPIRES_IN=30d
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: healthify-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
  uploads-data:
